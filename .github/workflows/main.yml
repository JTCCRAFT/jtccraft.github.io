name: Error Lobotomizer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-shout:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Run code check and parse errors
      id: checker
      continue-on-error: true 
      run: |
        # Run the linter, output to compact format, and save logs to a text file
        npm run lint -- --format compact > errors.txt 2>&1
        
    - name: FIRE IN THE HOLE!
      run: |
        if [ -f errors.txt ]; then
          # Count lines containing error indicators
          ERROR_COUNT=$(grep -c -i "error" errors.txt || true)
          
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "Found $ERROR_COUNT errors!"
            
            # Loop for the exact number of error matches found
            for ((i=1; i<=ERROR_COUNT; i++)); do
              echo "🔥 Fire in the hole! (Error #$i)"
            done
            
            # Print the actual errors below the flags so they can be fixed
            echo -e "\n--- Actual Error Logs ---"
            cat errors.txt
            
            # Intentionally fail the step so the pull request check turns red
            exit 1
          else
            echo "💦 Water on the hill!"
          fi
        else
          echo "No error report was generated."
        fi
