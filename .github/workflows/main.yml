name: Advanced Code Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: Scans site files for structural errors or conflict leftovers
  code-analysis:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Run code check and parse errors
      run: |
        touch errors.txt
        grep -rn "<<<<<<<" . --exclude="*.txt" --exclude-dir=".git" --exclude-dir=".github" >> errors.txt || true
        grep -rn "src=\"\"" . --exclude="*.txt" --exclude-dir=".git" --exclude-dir=".github" >> errors.txt || true

    - name: Say Fire In The Hole for each error
      run: |
        if [ -s errors.txt ]; then
          ERROR_COUNT=$(wc -l < errors.txt)
          echo "Found $ERROR_COUNT code issues!"
          for ((i=1; i<=ERROR_COUNT; i++)); do
            echo "🔥 Fire in the hole! (Error #$i)"
          done
          echo -e "\n--- Actual Error Logs ---"
          cat errors.txt
          exit 1
        else
          echo "💦 Water on the hill!"
        fi

  # JOB 2: Runs in parallel to scan files for exposed API keys or secrets
  security-audit:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Scan for raw credentials
      run: |
        touch secrets_found.txt
        grep -rniE "(api_key|secret|password|passwd|token)\s*=\s*['\"][a-zA-Z0-9_-]+['\"]" . --exclude="*.txt" --exclude-dir=".git" --exclude-dir=".github" >> secrets_found.txt || true

    - name: Verify Security Status
      run: |
        if [ -s secrets_found.txt ]; then
          BAD_COUNT=$(wc -l < secrets_found.txt)
          echo "⚠️ Detected $BAD_COUNT potential leaked credentials!"
          for ((i=1; i<=BAD_COUNT; i++)); do
            echo "🔥 Fire in the hole! (Security Risk #$i)"
          done
          cat secrets_found.txt
          exit 1
        else
          echo "🔒 Security scanning passed cleanly."
        fi

  # NEW JOB 3: Formally tests your workflow configurations for real errors!
  workflow-validation:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Check for workflow syntax errors
      run: |
        # Download actionlint to safely check for structural bugs in your pipeline
        bash <(curl https://githubusercontent.com)
        ./actionlint -format "{{.File}}:{{.Line}}:{{.Message}}" > workflow_errors.txt || true

    - name: Say Fire In The Hole for workflow bugs
      run: |
        if [ -s workflow_errors.txt ]; then
          WF_COUNT=$(wc -l < workflow_errors.txt)
          echo "Found $WF_COUNT bugs in your automation scripts!"
          for ((i=1; i<=WF_COUNT; i++)); do
            echo "🔥 Fire in the hole! (Workflow Bug #$i)"
          done
          echo -e "\n--- Actionlint Bug Logs ---"
          cat workflow_errors.txt
          exit 1
        else
          echo "🤖 Workflows are structurally perfect!"
        fi

  # JOB 4: Runs only after ALL validation jobs pass successfully
  production-readiness:
    runs-on: ubuntu-latest
    needs: [code-analysis, security-audit, workflow-validation]
    steps:
    - name: Confirm Status
      run: |
        echo "All validation stages passed!"
        echo "💦 Water on the hill!"
